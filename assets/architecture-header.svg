<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.75"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minorGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <linearGradient id="bgFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#0d1117" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b949e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="280" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="276" rx="5" fill="url(#majorGrid)"/>
  <rect x="2" y="2" width="1196" height="276" rx="5" fill="url(#bgFade)"/>

  <!-- Right-Side Isometric / Topological Mesh & System Fabric -->
  <g transform="translate(640, 20)" stroke="#30363d" fill="none">
    <!-- Outer coordinate frame -->
    <rect x="40" y="16" width="480" height="208" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="40" y1="120" x2="520" y2="120" stroke="#21262d" stroke-width="0.75"/>
    <line x1="280" y1="16" x2="280" y2="224" stroke="#21262d" stroke-width="0.75"/>

    <!-- Layered Ring / Consensus Topology -->
    <ellipse cx="280" cy="120" rx="190" ry="74" stroke="#30363d" stroke-width="1"/>
    <ellipse cx="280" cy="120" rx="135" ry="50" stroke="#484f58" stroke-width="1" stroke-dasharray="6 4"/>
    <ellipse cx="280" cy="120" rx="75" ry="28" stroke="#6e7681" stroke-width="1"/>

    <!-- Directed Acyclic Graph / Fabric Edges -->
    <g stroke="#484f58" stroke-width="1">
      <line x1="90" y1="120" x2="145" y2="120"/>
      <line x1="415" y1="120" x2="470" y2="120"/>
      <line x1="146" y1="68" x2="205" y2="120"/>
      <line x1="146" y1="172" x2="205" y2="120"/>
      <line x1="414" y1="68" x2="355" y2="120"/>
      <line x1="414" y1="172" x2="355" y2="120"/>
      <line x1="205" y1="120" x2="280" y2="92"/>
      <line x1="205" y1="120" x2="280" y2="148"/>
      <line x1="355" y1="120" x2="280" y2="92"/>
      <line x1="355" y1="120" x2="280" y2="148"/>
      <line x1="280" y1="46" x2="280" y2="92"/>
      <line x1="280" y1="148" x2="280" y2="194"/>
      <line x1="146" y1="68" x2="280" y2="46"/>
      <line x1="414" y1="68" x2="280" y2="46"/>
      <line x1="146" y1="172" x2="280" y2="194"/>
      <line x1="414" y1="172" x2="280" y2="194"/>
    </g>

    <!-- Active Quorum / Critical Path Highlight -->
    <polyline points="90,120 146,68 280,92 355,120 414,172 470,120" stroke="#c9d1d9" stroke-width="1.5" stroke-opacity="0.85">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="4s" repeatCount="indefinite"/>
    </polyline>

    <!-- Topology Nodes -->
    <g fill="#0d1117" stroke="#c9d1d9" stroke-width="1.5">
      <circle cx="90" cy="120" r="4"/>
      <circle cx="470" cy="120" r="4"/>
      <circle cx="146" cy="68" r="4.5"/>
      <circle cx="146" cy="172" r="4"/>
      <circle cx="414" cy="68" r="4"/>
      <circle cx="414" cy="172" r="4.5"/>
      <circle cx="205" cy="120" r="5"/>
      <circle cx="355" cy="120" r="5"/>
      <circle cx="280" cy="46" r="4"/>
      <circle cx="280" cy="194" r="4"/>
      <circle cx="280" cy="92" r="5.5" fill="#c9d1d9"/>
      <circle cx="280" cy="148" r="5.5"/>
      <rect x="274" y="114" width="12" height="12" fill="#f0f6fc" stroke="#0d1117" stroke-width="1.5"/>
    </g>

    <!-- Node Coordinate Annotations -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#6e7681">
      <text x="50" y="30">TOPOLOGY // DETERMINISTIC_MESH_V4</text>
      <text x="415" y="30">QUORUM: STRICT</text>
      <text x="50" y="216">LATENCY_BOUND: P99.9 &lt; 140us</text>
      <text x="392" y="216">ZERO_COPY_IPC: ON</text>
      <text x="292" y="89" fill="#c9d1d9">N0 [LEADER]</text>
      <text x="292" y="154">N1 [REPLICA]</text>
      <text x="102" y="62">INGRESS_RING</text>
      <text x="422" y="184">COMMIT_LOG</text>
    </g>
  </g>

  <!-- Left-Side Architectural Typography & Telemetry Header -->
  <g transform="translate(48, 42)">
    <!-- Top Classification Bar -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e" letter-spacing="2">
      <text x="0" y="12">SYSTEMS ARCHITECTURE  //  DISTRIBUTED INFRASTRUCTURE  //  COMPUTE KERNELS</text>
    </g>
    <line x1="0" y1="24" x2="580" y2="24" stroke="url(#lineGrad)" stroke-width="1"/>

    <!-- Primary Identity -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f0f6fc" letter-spacing="-1">
      NOR4IS
    </text>
    <text x="182" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#6e7681" letter-spacing="1">
      [SYS_ARCH // KERNEL_TO_CLUSTER]
    </text>

    <!-- Engineering Thesis -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#c9d1d9">
      Designing predictable, high-throughput systems from storage internals and lock-free memory
    </text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#c9d1d9">
      hierarchies to consensus-driven network fabrics and low-latency inference runtimes.
    </text>

    <!-- Bottom Structural Spec Strip -->
    <g transform="translate(0, 172)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="142" height="28" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#c9d1d9">STORAGE ENGINES</text>

      <rect x="152" y="0" width="138" height="28" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="164" y="18" fill="#c9d1d9">CONSENSUS &amp; RPC</text>

      <rect x="300" y="0" width="128" height="28" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="312" y="18" fill="#c9d1d9">HPC &amp; KERNELS</text>

      <rect x="438" y="0" width="152" height="28" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="450" y="18" fill="#c9d1d9">AI INFERENCE INFRA</text>
    </g>
  </g>

  <!-- Bottom Edge Status Bar -->
  <line x1="2" y1="252" x2="1198" y2="252" stroke="#21262d" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#6e7681">
    <text x="48" y="269">INVARIANT: MECHANICAL SYMPATHY OVER ABSTRACTION TAX</text>
    <text x="540" y="269">ALIGNMENT: STRICT MONOCHROME // ZERO-OVERHEAD</text>
    <text x="1035" y="269">STATUS: OPERATIONAL</text>
  </g>
</svg>
